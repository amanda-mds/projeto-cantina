<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/estilo.css}">
    <title>Cardápio - APPetite</title>
</head>
<body>
<header>
    <div class="wrap">
        <div class="brand">APPetite</div>
        <nav>
            <a th:href="@{/cardapio}">Cardápio</a>
            <a th:href="@{/pedido/novo}">Novo pedido</a>
            <a th:href="@{/pedido/meus}">Meus pedidos</a>
            <a th:href="@{/login}">Entrar</a>
        </nav>
    </div>
</header>

<main>
    <div class="card">
        <h1>Cardápio</h1>

        <form method="get" th:action="@{/cardapio}" class="grid grid-2">
            <div>
                <label for="nome">Buscar por nome</label>
                <input id="nome" name="nome" th:value="${filtroNome}" type="text">
            </div>

            <div>
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria">
                    <option value="">Todas</option>
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria}"
                            th:text="${categoria.descricao}"
                            th:selected="${categoria == filtroCategoria}">
                    </option>
                </select>
            </div>

            <div>
                <button type="submit">Filtrar</button>
            </div>
        </form>
    </div>

    <div class="grid grid-3">
        <div class="card" th:each="produto : ${produtos}">
            <h3 th:text="${produto.nome}"></h3>
            <p class="muted" th:text="${produto.categoria.descricao}"></p>
            <p th:text="${produto.descricao}"></p>
            <p class="price"
               th:text="${'R$ ' + #numbers.formatDecimal(produto.precoVenda, 1, 2)}"></p>
            <p th:text="${'Estoque: ' + produto.estoqueAtual}"></p>
            <a class="btn" th:href="@{/cardapio/{id}(id=${produto.id})}">Detalhes</a>
        </div>
    </div>
</main>
</body>
</html>
